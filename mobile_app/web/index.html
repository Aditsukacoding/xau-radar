<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Institutional Macro & Technical Trading Analytics for XAU/USD">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="XAU Radar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>XAU/USD Radar</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0A0D14;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      width: 100%;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: radial-gradient(circle at 50% 40%, #161F33 0%, #0A0D14 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .radar-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .radar-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.4);
      animation: radar-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .radar-ring-2 {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(245, 158, 11, 0.25);
      animation: radar-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      animation-delay: 0.6s;
    }

    .radar-core {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-core svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #F59E0B;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .splash-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #FFFBEB 0%, #FDE68A 30%, #F59E0B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 6px 0;
      text-align: center;
    }

    .splash-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #94A3B8;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin: 0 0 28px 0;
      text-align: center;
    }

    .splash-loader-bar {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .splash-loader-indicator {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #F59E0B, #FBBF24);
      border-radius: 99px;
      position: absolute;
      animation: loader-slide 1.4s ease-in-out infinite;
    }

    #splash-status {
      font-size: 11px;
      color: #64748B;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
    }

    @keyframes radar-ping {
      0% {
        transform: scale(0.85);
        opacity: 0.9;
      }
      80%, 100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    @keyframes loader-slide {
      0% {
        left: -45%;
      }
      50% {
        left: 50%;
      }
      100% {
        left: 105%;
      }
    }
  </style>
</head>
<body>
  <!-- Apple-Style Dynamic Preloader -->
  <div id="splash-screen">
    <div class="radar-wrapper">
      <div class="radar-ring"></div>
      <div class="radar-ring-2"></div>
      <div class="radar-core">
        <svg viewBox="0 0 24 24">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
      </div>
    </div>
    <div class="splash-title">XAU/USD RADAR</div>
    <div class="splash-subtitle">Institutional Bias Engine</div>
    <div class="splash-loader-bar">
      <div class="splash-loader-indicator"></div>
    </div>
    <div id="splash-status">Memuat modul analitik iPhone...</div>
  </div>

  <script>
    // Progressive status updates
    var statusEl = document.getElementById('splash-status');
    var statusMessages = [
      'Menghubungkan data engine...',
      'Sinkronisasi kalender & sentimen...',
      'Menyiapkan tampilan dashboard...'
    ];
    var msgIdx = 0;
    var statusTimer = setInterval(function() {
      if (statusEl && msgIdx < statusMessages.length) {
        statusEl.textContent = statusMessages[msgIdx++];
      }
    }, 900);

    function dismissSplash() {
      clearInterval(statusTimer);
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 450);
      }
    }

    // 1. Flutter Web primary event
    window.addEventListener('flutter-first-frame', function() {
      dismissSplash();
    });

    // 2. DOM MutationObserver fallback (triggers when Flutter mounts canvas/flutter-view)
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || 
          document.querySelector('canvas') || 
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flt-scene-host')) {
        setTimeout(dismissSplash, 150);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Safety timeout: dismiss after 7 seconds max
    setTimeout(dismissSplash, 7000);

    // 4. Global error trap for diagnostics on mobile Safari
    window.addEventListener('error', function(e) {
      console.error('Bootstrap Error caught:', e);
      if (statusEl) {
        statusEl.innerHTML = '<span style="color:#FB7185;font-weight:600;">Gagal memuat modul:</span><br>' + 
          '<span style="color:#94A3B8;font-size:10px;">' + (e.message || 'Koneksi terputus') + '</span><br>' +
          '<button onclick="location.reload()" style="margin-top:10px;padding:6px 14px;background:#F59E0B;border:none;border-radius:6px;color:#0F172A;font-weight:bold;font-size:11px;cursor:pointer;">Muat Ulang</button>';
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
